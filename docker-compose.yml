# Wikipedia edits -> Kafka -> Flink SQL
# Services on the compose network reach each other by service name (kafka, jobmanager).
# Your Mac reaches them through the published ports (localhost:9092, :8081, :8080).

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"            # for clients on your Mac
    environment:
      CLUSTER_ID: wiki-stream-lab-cluster-1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller   # KRaft: no ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: one for containers (kafka:29092), one for the host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so every replication factor must be 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build: ./producer
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: wiki.recentchange
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  jobmanager:
    build: ./flink
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"            # Flink web UI
    environment:
      FLINK_PROPERTIES: &flink-props |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        taskmanager.memory.process.size: 2048m
        jobmanager.memory.process.size: 1024m
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./sql:/opt/sql          # edit SQL on your Mac, run it inside the container

  taskmanager:
    build: ./flink
    container_name: taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *flink-props
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      - jobmanager

volumes:
  kafka-data:
  flink-checkpoints:
